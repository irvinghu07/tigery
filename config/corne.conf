# Corne RGB Underglow (per-key reverse-mount WS2812B)
CONFIG_ZMK_RGB_UNDERGLOW=y
CONFIG_WS2812_STRIP=y

# Power safety: per-key LEDs on every switch draw a lot of current on BLE.
# Cap brightness and auto-off when idle to protect battery life.
CONFIG_ZMK_RGB_UNDERGLOW_BRT_MAX=50
CONFIG_ZMK_RGB_UNDERGLOW_AUTO_OFF_IDLE=y
# CONFIG_ZMK_RGB_UNDERGLOW_AUTO_OFF_USB=y   # uncomment to also kill RGB on battery

# Uncomment the following line to enable the Corne OLED Display
# CONFIG_ZMK_DISPLAY=y
